{{- if and .Values.mcp.enabled .Values.mcp.networkPolicy }}
# The MCP server needs no outbound network. Denying all egress also blocks DNS
# lookups from caller-supplied Helm templates (Sprig getHostByName).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.mcp.name }}-deny-egress
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Values.mcp.name }}
  policyTypes:
  - Egress
  egress: []
{{- end }}
